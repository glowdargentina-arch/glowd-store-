  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            display: ['Inter Tight', 'Inter', 'ui-sans-serif'],
            serif: ['Instrument Serif', 'ui-serif', 'Georgia'],
            mono: ['JetBrains Mono', 'ui-monospace']

            ink: {

  <style>
    :root { color-scheme: dark; }
    html, body { background: #0A0A0A; }
    body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    /* Custom scrollbar (subtle) */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
    html.light ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); }

    /* Reveal-on-scroll */
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
    .reveal.in { opacity: 1; transform: none; }

    /* Marquee */
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-track { animation: marquee 40s linear infinite; }

    /* Glow ring for highlights */
    .ig-ring {
      background:
        conic-gradient(from 220deg, #ffffff 0%, #6b6b6b 25%, #ffffff 50%, #2a2a2a 75%, #ffffff 100%);
    }
    html.light .ig-ring {
      background:
        conic-gradient(from 220deg, #0a0a0a 0%, #888 25%, #0a0a0a 50%, #d0d0d0 75%, #0a0a0a 100%);
    }

    /* Striped placeholder */
    .stripe-placeholder {
      background-image:
        repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 10px, rgba(255,255,255,0.00) 10px 20px);
    }
    html.light .stripe-placeholder {
      background-image:
        repeating-linear-gradient(135deg, rgba(0,0,0,0.05) 0 10px, rgba(0,0,0,0.00) 10px 20px);
    }

    /* No-scroll when modal open */
    body.locked { overflow: hidden; }

    /* Pulse for WA */
    @keyframes wapulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.25); } 70% { box-shadow: 0 0 0 18px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
    .wa-pulse { animation: wapulse 2.6s ease-out infinite; }
    html.light .wa-pulse { animation-name: wapulselight; }
    @keyframes wapulselight { 0% { box-shadow: 0 0 0 0 rgba(0,0,0,.18); } 70% { box-shadow: 0 0 0 18px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }

    /* Hero number glyph */
    .hero-glyph { font-family: 'Inter Tight', sans-serif; font-weight: 800; letter-spacing: -0.06em; }

    /* iPhone silhouette gradient mask */
    .phone-shine {
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(180deg, #1a1a1a 0%, #0e0e0e 50%, #1a1a1a 100%);
    }
    html.light .phone-shine {
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(0,0,0,.06), transparent 60%),
        linear-gradient(180deg, #ededed 0%, #f7f7f7 50%, #ededed 100%);
    }

    /* Soft focus rings */
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid rgba(255,255,255,.4);
      outline-offset: 3px;
      border-radius: 4px;
    }
    html.light button:focus-visible, html.light a:focus-visible, html.light input:focus-visible, html.light select:focus-visible {
      outline-color: rgba(0,0,0,.45);
    }

    /* Hide chrome when printing */
    @media print { .no-print { display: none !important; } }
  </style>

<body class="bg-ink-900 text-white antialiased">
  <div id="root"></div>

  <!-- Prevent the browser from navigating when a file is dropped outside an <image-slot> -->
  <script>
    ['dragover','drop'].forEach(t => window.addEventListener(t, function(e){
      if (e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files')) {
        // Allow the image-slot's own listener to handle drops within slots.
        let n = e.target;
        while (n && n.tagName !== 'IMAGE-SLOT' && n !== document.body) n = n.parentNode;
        if (n && n.tagName === 'IMAGE-SLOT') return;
        e.preventDefault();
      }
    }, { capture: true }));
  </script>
